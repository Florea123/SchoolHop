<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Înregistrare · SchoolHop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/register.css">
  <script type="module" src="js/pages/register.js"></script>
</head>
<body class="auth-body">
  <main class="auth-main" id="main">
    <div class="auth-brand"><span class="brand"><span class="brand-name">School<b>Hop</b></span></span></div>
    <div class="auth-card">
      <div class="steps" aria-label="Pasul 1 din 3"><span class="done"></span><span></span><span></span></div>
      <span class="eyebrow">Pasul 1 din 3</span>
      <h1 class="page-title">Cont nou</h1>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="fullName">Numele tău complet</label>
          <input class="form-input" id="fullName" autocomplete="name" required maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" autocomplete="email" required maxlength="150" placeholder="nume@exemplu.ro">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Telefon</label>
          <input class="form-input" type="tel" id="phone" autocomplete="tel" inputmode="tel" required maxlength="16" placeholder="07xx xxx xxx">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Parolă</label>
            <input class="form-input" type="password" id="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="min. 8 caractere, literă + cifră">
          </div>
          <div class="form-group">
            <label class="form-label" for="passwordConfirm">Confirmă parola</label>
            <input class="form-input" type="password" id="passwordConfirm" autocomplete="new-password" required maxlength="72">
          </div>
        </div>

        <div class="card school-box">
          <div class="card-title">Școala și copilul</div>
          <div class="form-group">
            <label class="form-label" for="school">Școala</label>
            <select class="form-input" id="school" required><option value="">Se încarcă…</option></select>
          </div>
          <div id="childFields"></div>
        </div>

        <label class="checkbox"><input type="checkbox" id="consent"> <span>Confirm că sunt părintele / tutorele legal al copilului.</span></label>
        <p class="form-hint error" id="formError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="submit">Creează contul</button>
      </form>
      <p class="switch-auth">Ai deja cont? <a href="login.html" class="strong">Intră în cont</a></p>
    </div>
  </main>
</body>
</html>
