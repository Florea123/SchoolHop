<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Contact de urgență · SchoolHop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/emergency.css">
  <script type="module" src="js/pages/emergency.js"></script>
</head>
<body class="auth-body">
  <main class="auth-main" id="main">
    <div class="auth-brand"><span class="brand"><span class="brand-name">School<b>Hop</b></span></span></div>
    <div class="auth-card">
      <div class="steps" aria-label="Pasul 3 din 3"><span class="done"></span><span class="done"></span><span class="done"></span></div>
      <span class="eyebrow">Pasul 3 din 3 · Contact</span>
      <h1 class="page-title">Contact de urgență</h1>
      <p class="page-subtitle">Persoana anunțată în caz de alertă pe traseu.</p>

      <form id="emergencyForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="ecName">Contact de urgență (al doilea părinte / bunic)</label>
          <input class="form-input" id="ecName" required maxlength="100" placeholder="ex: Maria Popescu">
        </div>
        <div class="form-group">
          <label class="form-label" for="ecPhone">Telefon contact de urgență</label>
          <input class="form-input" id="ecPhone" type="tel" inputmode="tel" required maxlength="16" placeholder="07xx xxx xxx">
        </div>
        <p class="form-hint error" id="formError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="submit">Activează profilul de familie</button>
      </form>
    </div>
  </main>
</body>
</html>
