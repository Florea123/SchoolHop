<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Caută cursă · SchoolHop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/search.css">
  <script type="module" src="js/pages/search.js"></script>
</head>
<body>
  <header id="appHeader"></header>
  <main class="app-main" id="main">
    <div class="page-head">
      <a class="btn-icon" href="home.html" id="back" aria-label="Înapoi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="eyebrow">Căutare cursă</span>
    </div>
    <h1 class="page-title">Căutare cursă colegi</h1>
    <p class="page-subtitle" id="subtitle">Plecare din cartier către școală</p>

    <div class="split">
      <div class="map-box" id="map"></div>
      <form id="searchForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="child">Pasager elev</label>
          <select class="form-input" id="child"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="direction">Direcție</label>
          <select class="form-input" id="direction">
            <option value="to_school">Spre școală (dimineața)</option>
            <option value="from_school">Spre casă (după ore)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="area">Punct de plecare (zona)</label>
          <select class="form-input" id="area"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="school">Școala</label>
          <input class="form-input" id="school" readonly>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="date">Data</label>
            <input class="form-input" type="date" id="date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="arriveBy">Ora sosirii dorite</label>
            <input class="form-input" type="time" id="arriveBy">
            <span class="form-hint" id="bellHint"></span>
          </div>
        </div>
        <p class="form-hint error" id="formError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Vezi cursele disponibile</button>
      </form>
    </div>
  </main>
</body>
</html>
