<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Verificare școlară · SchoolHop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/verify.css">
  <script type="module" src="js/pages/verify.js"></script>
</head>
<body class="auth-body">
  <main class="auth-main" id="main">
    <div class="auth-brand"><span class="brand"><span class="brand-name">School<b>Hop</b></span></span></div>
    <div class="auth-card">
      <div class="steps" aria-label="Pasul 2 din 3"><span class="done"></span><span class="done"></span><span></span></div>
      <span class="eyebrow">Pasul 2 din 3 · Verificare</span>
      <h1 class="page-title">Validare cont școlar</h1>
      <p class="page-subtitle" id="subtitle">Sincronizare cu registrul oficial al școlii…</p>

        <div id="children"><div class="skeleton"></div></div>

      <details class="card add-child" id="addChild">
        <summary class="strong">Mai ai un copil la această școală?</summary>
        <form id="claimForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="claimAccount">ID cont școlar al celui de-al doilea copil</label>
            <input class="form-input" id="claimAccount" autocapitalize="characters" spellcheck="false" maxlength="40">
          </div>
          <button class="btn btn-secondary btn-block" type="submit" id="claimSubmit">Adaugă copilul</button>
        </form>
      </details>

      <p class="form-hint error" id="formError" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" id="continue">Continuă la contactul de urgență</button>
    </div>
  </main>
</body>
</html>
