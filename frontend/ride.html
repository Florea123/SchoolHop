<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Cursa live · SchoolHop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/ride.css">
  <script type="module" src="js/pages/ride.js"></script>
</head>
<body>
  <header id="appHeader"></header>
  <main class="app-main" id="main">
    <div class="page-head">
      <a class="btn-icon" href="my-rides.html" id="back" aria-label="Înapoi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="eyebrow" id="eyebrow">Cursa</span>
      <span id="statusBadge"></span>
    </div>
    <h1 class="page-title" id="title">Se încarcă cursa…</h1>
    <p class="page-subtitle" id="subtitle"></p>
    <div id="alerts"></div>
    <div class="split">
      <div>
        <div class="topic-card" id="topic" hidden></div>
        <div class="map-box" id="map"></div>
        <div id="eta"></div>
      </div>
      <div>
        <div id="people"></div>
        <div id="actions"></div>
      </div>
    </div>

    <dialog class="modal" id="sosDialog">
      <h2 class="card-title">Trimiți alertă SOS?</h2>
      <p class="small muted" style="margin-bottom:14px">Șoferul, ceilalți părinți de pe cursă și secretariatul școlii primesc imediat alerta cu ultima locație a mașinii.</p>
      <div id="sosResult"></div>
      <div class="btn-row" id="sosButtons">
        <button class="btn btn-secondary" id="sosCancel">Renunță</button>
        <button class="btn btn-danger" id="sosConfirm">Trimite SOS</button>
      </div>
    </dialog>

    <dialog class="modal" id="shareDialog">
      <h2 class="card-title">Link pentru bunici / celălalt părinte</h2>
      <p class="small muted" style="margin-bottom:10px">Oricine are linkul poate vedea doar statusul copilului și ora estimată de sosire.</p>
      <input class="form-input" id="shareUrl" readonly>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-secondary" id="shareClose">Închide</button>
        <button class="btn btn-primary" id="shareCopy">Copiază linkul</button>
      </div>
    </dialog>
  </main>
</body>
</html>
